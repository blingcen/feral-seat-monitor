name: Ticketlink Multi-event Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketlink-multi-event-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect configured Ticketlink events
        env:
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python monitor.py
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketlink-inspection-${{ github.run_id }}
          path: monitor-results.json
          if-no-files-found: ignore
          retention-days: 7
